name: 火种VPN 节点自动提取

on:
  schedule:
    - cron: '0 20 * * *'  # 每天 UTC 20:00 触发（北京时间 次日 04:00）
  workflow_dispatch:  # 允许手动触发

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行节点提取
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          HZ_USERNAME: ${{ secrets.HZ_USERNAME }}
          HZ_PASSWORD: ${{ secrets.HZ_PASSWORD }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python3 huozhong_fetch.py

      - name: 上传节点文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huozhong-nodes
          path: ${{ github.workspace }}/huozhong_nodes.txt
          retention-days: 7

      - name: 上传运行日志
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: run-logs
          path: /home/runner/work/_temp/*.log
          retention-days: 3
